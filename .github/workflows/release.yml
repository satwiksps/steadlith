name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and release tools
        run: python -m pip install -e ".[dev]" twine

      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt

      - name: Lint release source
        run: python -m ruff check .

      - name: Check release formatting
        run: python -m ruff format --check .

      - name: Type-check release source
        run: python -m mypy src/steadlith

      - name: Test release source
        run: python -m pytest

      - name: Build documentation
        run: python -m sphinx -W --keep-going -b dirhtml docs docs/_build/dirhtml

      - name: Verify exact release tag and classify version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          from packaging.version import Version

          version = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          assert actual == expected, f"release tag {actual!r} must exactly match {expected!r}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_prerelease={str(Version(version).is_prerelease).lower()}\n")
          PY

      - name: Build source and wheel distributions
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install and smoke-test the built wheel
        run: |
          wheel_venv="$(mktemp -d)"
          python -m venv "$wheel_venv"
          wheel_python="$wheel_venv/bin/python"
          "$wheel_python" -m pip install --no-cache-dir dist/*.whl
          "$wheel_python" -m pip check
          "$wheel_python" tests/smoke_installed.py

      - name: Attest distributions
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "dist/*"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  website:
    name: Validate website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint website
        run: npm run lint

      - name: Type-check website
        run: npm run typecheck

      - name: Build website
        run: npm run build

      - name: Smoke-test production website
        run: npm run smoke

  publish-github:
    name: Create GitHub release
    needs: [build, website]
    if: ${{ vars.STEADLITH_RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Create or update release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.build.outputs.is_prerelease }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          elif [ "$IS_PRERELEASE" = "true" ]; then
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --prerelease \
              --title "Steadlith ${RELEASE_TAG#v}"
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes \
              --title "Steadlith ${RELEASE_TAG#v}"
          fi

  publish-pypi:
    name: Publish to PyPI
    needs: [build, website, publish-github]
    if: ${{ vars.STEADLITH_RELEASE_ENABLED == 'true' && needs.build.outputs.is_prerelease == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/steadlith/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
